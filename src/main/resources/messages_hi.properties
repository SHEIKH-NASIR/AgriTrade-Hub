services.item2.title=लाइव उत्पाद लिस्टिंग
services.item2.desc=किसान अपने उपलब्ध उत्पादों को रियल-टाइम में सूचीबद्ध कर सकते हैं, जबकि व्यापारी कभी भी उत्पादों को देखकर ऑर्डर कर सकते हैं।

services.item3.title=आसान ऑर्डर प्रबंधन
services.item3.desc=किसानों और व्यापारियों के लिए बनाए गए सहज डैशबोर्ड से ऑर्डर की स्थिति देखें, प्रबंधित करें और अपडेट करें।

services.item4.title=श्रेणी-वार उत्पाद फ़िल्टरिंग
services.item4.desc=व्यापारी गतिशील श्रेणियों के आधार पर उत्पादों को खोज सकते हैं और अपनी आवश्यकता के अनुसार सही उत्पाद जल्दी ढूंढ सकते हैं।

services.item5.title=सुरक्षित लॉगिन और प्रोफ़ाइल
services.item5.desc=प्रत्येक उपयोगकर्ता को सुरक्षित लॉगिन और व्यक्तिगत प्रोफ़ाइल मिलती है, जहां वे लेनदेन, इतिहास और उत्पाद अपडेट देख सकते हैं।

services.item6.title=रिपोर्ट और डैशबोर्ड
services.item6.desc=उपयोगकर्ता रियल-टाइम में अपने ऑर्डर, राजस्व और गतिविधियों की जानकारी उपयोगी डैशबोर्ड के माध्यम से देख सकते हैं।

# Additional Services

services.item7.title=सुरक्षित ऑनलाइन भुगतान
services.item7.desc=एकीकृत ऑनलाइन भुगतान सेवाओं के माध्यम से कृषि लेनदेन को सुरक्षित रूप से पूरा करें और विश्वसनीय एवं सुविधाजनक भुगतान सुविधा प्राप्त करें।

services.item8.title=AI आधारित मांग पूर्वानुमान
services.item8.desc=AI आधारित मांग संबंधी जानकारी का उपयोग करके किसानों और खरीदारों को अपेक्षित उत्पाद मांग समझने तथा बेहतर खरीद निर्णय लेने में सहायता करें।

services.item9.title=लॉजिस्टिक्स और रूट ऑप्टिमाइज़ेशन
services.item9.desc=डिलीवरी मार्गों और परिवहन योजना को बेहतर बनाकर यात्रा समय कम करें, डिलीवरी दक्षता बढ़ाएं और लॉजिस्टिक्स लागत घटाने में सहायता करें।

services.item10.title=उचित मूल्य सत्यापन
services.item10.desc=उपलब्ध बाजार जानकारी के आधार पर कृषि उत्पादों की कीमतों का सत्यापन करें और किसानों एवं खरीदारों के लिए उचित तथा पारदर्शी मूल्य निर्धारण को बढ़ावा दें।

services.item11.title=लैंडेड कॉस्ट कैलकुलेशन
services.item11.desc=उत्पाद की कीमत और लॉजिस्टिक्स खर्च को जोड़कर पूरी लैंडेड कॉस्ट की गणना करें, ताकि खरीदार वास्तविक खरीद लागत की तुलना कर सकें।

services.item12.title=कीमत और लॉजिस्टिक्स तुलना
services.item12.desc=अधिक किफायती खरीद विकल्प पहचानने के लिए उत्पाद की कीमत के साथ परिवहन और लॉजिस्टिक्स लागत की तुलना करें।

