# About section

home.about.subtitle=हमें क्यों चुनें
home.about.title=AgriTrade Hub एक बेहतर विकल्प क्यों है
home.about.desc=AgriTrade Hub किसानों को सीधे व्यापारियों से जोड़कर बिचौलियों को कम करता है, जिससे किसानों को बेहतर कीमत और तेज़ व्यापार मिलता है। सरल इंटरफ़ेस और सुरक्षित लेनदेन के साथ हम स्थानीय किसानों को सशक्त बनाते हैं और उचित एवं टिकाऊ कृषि को बढ़ावा देते हैं।

home.about.feature1.title=प्रत्यक्ष मार्केटप्लेस
home.about.feature1.desc=हम किसानों और व्यापारियों के बीच की दूरी को कम करते हैं और बिचौलियों के बिना उचित एवं पारदर्शी व्यापार सुनिश्चित करते हैं।

home.about.feature2.title=किसानों के लिए बेहतर मुनाफा
home.about.feature2.desc=सीधे बिक्री के माध्यम से किसान अपनी मेहनत का बेहतर मूल्य प्राप्त करते हैं, जबकि व्यापारियों को प्रतिस्पर्धी कीमतों पर ताज़ी उपज मिलती है।

home.about.feature3.title=उपयोगकर्ता-अनुकूल प्लेटफ़ॉर्म
home.about.feature3.desc=छोटे किसानों से लेकर बड़े व्यापारियों तक सभी उपयोगकर्ताओं के लिए सरल और सहज इंटरफ़ेस।

# About-3 section

home.about3.title=पौधे जीवन को बेहतर बनाते हैं
home.about3.desc.bold=AgriTrade Hub में हमारा मानना है कि पौधे केवल हरियाली नहीं हैं — वे जीवन, स्वास्थ्य और स्थिरता का स्रोत हैं।

home.about3.desc=वायु गुणवत्ता में सुधार से लेकर मानसिक स्वास्थ्य को बेहतर बनाने और हमारी खाद्य प्रणाली को समर्थन देने तक, पौधे हमारे जीवन को बेहतर बनाने में महत्वपूर्ण भूमिका निभाते हैं। हमारा प्लेटफ़ॉर्म किसानों, नर्सरी, व्यापारियों और पौधों के प्रति उत्साही लोगों को जोड़ता है ताकि पौधों की खेती, व्यापार और उनके महत्व को बढ़ावा दिया जा सके। चाहे आप बगीचा तैयार कर रहे हों या व्यवसाय बढ़ा रहे हों, AgriTrade Hub वह स्थान है जहां हरियाली और विकास एक साथ मिलते हैं।

home.about3.point1=बिचौलियों को हटाने के लिए किसानों को सीधे व्यापारियों से जोड़ता है।
home.about3.point2=किसानों को अपनी उपज के बेहतर मूल्य प्राप्त करने में सहायता करता है।
home.about3.point3=कृषि उत्पादों की रियल-टाइम लिस्टिंग और ब्राउज़िंग की सुविधा देता है।

