
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FPO Login</title>

    <link rel="stylesheet"
          href="/assets/css/bootstrap.min.css">

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f7f6;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,.12);
        }

        .login-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-title h2 {
            color: #198754;
            font-weight: 700;
        }

        .form-control {
            height: 48px;
        }

        .btn-login {
            width: 100%;
            height: 48px;
            font-weight: 700;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #198754;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="login-card">

    <div class="login-title">

        <h2>FPO Login</h2>

        <p class="text-muted">
            Agritrade Hub
        </p>

    </div>


    <div th:if="${msg != null}"
         class="alert alert-info"
         th:text="${msg}">
    </div>


    <div th:if="${error != null}"
         class="alert alert-danger"
         th:text="${error}">
    </div>


    <form method="post"
          action="/fpo/login">

        <div class="mb-3">

            <label class="form-label">
                Email Address
            </label>

            <input type="email"
                   name="email"
                   class="form-control"
                   placeholder="Enter email"
                   required>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Password
            </label>

            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Enter password"
                   required>

        </div>


        <button type="submit"
                class="btn btn-success btn-login">

            Login

        </button>

    </form>


    <div class="back">

        <a href="/">
            Back to Home
        </a>

    </div>

</div>

</body>

</html>
