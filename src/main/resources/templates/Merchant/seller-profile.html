<html xmlns:th="https://www.thymeleaf.org" th:replace="~{Merchant/merchantbase::layout(~{::section})}"><section><div class="container"><div class="card shadow-sm"><div class="card-body"><h3 th:text="${seller.name}">Seller</h3><span class="badge bg-success">✓ Verified platform seller</span><h2 class="mt-3">⭐ <span th:text="${averageRating}">0.0</span>/5</h2><p><span th:text="${reviewCount}">0</span> verified reviews</p><hr><div th:if="${#lists.isEmpty(reviews)}" class="text-muted">No reviews yet.</div><div th:each="r : ${reviews}" class="border rounded p-3 mb-2"><div>⭐⭐⭐⭐⭐ <strong th:text="${r.rating + '/5'}">5/5</strong></div><p th:if="${r.comment != null}" th:text="${r.comment}">Great seller</p><small class="text-muted">Verified purchase • <span th:text="${r.merchant.name}">Merchant</span></small></div></div></div></div></section></html>
