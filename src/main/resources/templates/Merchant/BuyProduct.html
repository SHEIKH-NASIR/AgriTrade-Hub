
<html th:replace="~{Merchant/merchantbase::layout(~{::section})}">
<section>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-10">

        <div class="card shadow-lg border-0">
          <div class="row g-0">

            <!-- Product Image -->
            <div class="col-md-5 text-center bg-light">
              <img th:src="@{'/ProductImage/' + ${product.image}}"
                   class="img-fluid p-4"
                   alt="Product Image"
                   style="max-height: 350px;" />
            </div>

            <!-- Product Details -->
            <div class="col-md-7">
              <div class="card-body">

                <h3 class="card-title fw-bold mb-3 text-primary"
                    th:text="${product.productName}">
                  Product Name
                </h3>

                <p class="text-muted mb-2">
                  <strong>Category:</strong>
                  <span th:text="${product.category}"></span>
                </p>

                <p class="mb-2">
                  <strong>Price per Unit:</strong>
                  ₹ <span id="unitPrice"
                           th:text="${product.pricePerUnit}"></span>
                </p>

                <p class="mb-2">
                  <strong>Available Quantity:</strong>
                  <span id="availableQuantity"
                        th:text="${product.quantity}"></span>
                </p>

                <p class="mb-2">
                  <strong>Minimum Order:</strong>
                  <span id="minimumOrderQuantity"
                        th:text="${product.minimumOrderQuantity}"></span>
                </p>

                <p class="mb-2">
                  <strong>Maximum Order:</strong>
                  <span id="maximumOrderQuantity"
                        th:text="${product.maxOrderQuantity > 0 ? (product.maxOrderQuantity < product.quantity ? product.maxOrderQuantity : product.quantity) : product.quantity}">
                  </span>
                </p>

                <p class="mb-2">
                  <strong>Status:</strong>

                  <span class="badge bg-success"
                        th:if="${product.status == 'Available'}"
                        th:text="${product.status}">
                  </span>

                  <span class="badge bg-danger"
                        th:if="${product.status != 'Available'}"
                        th:text="${product.status}">
                  </span>
                </p>

                <hr>

                <!-- Seller Details -->
                <p class="mb-1">
                  <strong>Sold by:</strong>
                  <a th:href="@{'/Merchant/Seller/Farmer/' + ${product.farmer.id}}" th:text="${product.farmer.name}"></a>
                  <span class="badge bg-warning text-dark">⭐ <span th:text="${@reviewService.averageForFarmer(product.farmer.id)}">0.0</span>/5</span>
                  <small class="text-muted">(<span th:text="${@reviewService.countForFarmer(product.farmer)}">0</span> verified reviews)</small>
                </p>

                <p class="mb-1">
                  <strong>Contact:</strong>
                  <span th:text="${product.farmer.contactno}"></span>
                </p>

                <p class="mb-3">
                  <strong>Location:</strong>
                  <span th:text="${product.farmer.address}"></span>
                </p>

                <!-- Purchase Form -->
                <form id="buyForm"
                      onsubmit="event.preventDefault(); startPayment();">

                  <div class="d-flex mb-2">

                    <input type="hidden"
                           id="productId"
                           name="productId"
                           th:value="${product.id}" />

                    <input type="number"
                           id="buyQty"
                           name="buyQuantity"
                           th:attr="min=${product.minimumOrderQuantity},max=${product.maxOrderQuantity > 0 ? (product.maxOrderQuantity < product.quantity ? product.maxOrderQuantity : product.quantity) : product.quantity}"
                           class="form-control me-2"
                           placeholder="Enter quantity"
                           required />

                    <button type="submit"
                            class="btn btn-success">
                      🛒 Confirm Purchase
                    </button>

                    <button th:if="${session.loggedInMerchant != null && session.loggedInMerchant.demoEnabled}"
                            type="button"
                            class="btn btn-outline-primary ms-2"
                            onclick="createDemoOrder()">
                      🧪 Demo Order
                    </button>

                  </div>

                  <!-- Product Amount -->
                  <div id="totalCost"
                       class="alert alert-info d-none">
                    💰
                    <strong>Product Amount:</strong>
                    ₹ <span id="totalAmount">0</span>
                  </div>

                  <!-- Logistics -->
                  <div id="logisticsInfo"
                       class="alert alert-warning d-none">
                  </div>

                </form>

              </div>
            </div>

          </div>
        </div>

        <!-- Back Button -->
        <div class="mt-4 text-center">
          <a th:href="@{/Merchant/Dashboard}"
             class="btn btn-outline-primary">
            ⬅️ Back to Products
          </a>
        </div>

      </div>
    </div>
  </div>


  <!-- Razorpay -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>


  <!-- Payment + Demo Order -->
  <script>

    function startPayment() {

      const qty =
        parseInt(document.getElementById("buyQty").value);

      const productId =
        document.getElementById("productId").value;

      const input =
        document.getElementById("buyQty");

      const minQty =
        parseInt(input.min);

      const maxQty =
        parseInt(input.max);


      // Validate quantity
      if (!Number.isInteger(qty) ||
          qty < minQty ||
          qty > maxQty) {

        alert(
          "Please enter a quantity between " +
          minQty +
          " and " +
          maxQty +
          "."
        );

        return;
      }


      fetch(
        `/Merchant/create-order?productId=${productId}&quantity=${qty}`
      )

      .then(r => r.json())

      .then(data => {

        if (data.error) {

          alert(
            "Error: " +
            data.error
          );

          return;
        }


        // Show logistics information
        const box =
          document.getElementById("logisticsInfo");


        const vehicle =
          String(data.vehicleType || "")
            .replaceAll("_", " ");


        box.innerHTML =
          `<strong>Road distance:</strong> ${data.roadDistanceKm} km |
           <strong>Vehicle:</strong> ${vehicle}<br>
           <strong>Product:</strong> ₹${Number(data.productAmount || 0).toFixed(2)} +
           <strong>Logistics:</strong> ₹${Number(data.logisticsAmount || 0).toFixed(2)} =
           <strong>Landed:</strong> ₹${Number(data.totalAmount || 0).toFixed(2)}`;


        box.classList.remove("d-none");


        // Razorpay options
        const options = {

          key:
            data.razorpayKeyId,

          amount:
            data.amount,

          currency:
            data.currency,

          name:
            "AgriTrade Hub",

          description:
            "Product + Logistics Purchase",

          order_id:
            data.orderId,


          handler:
            function(response) {

              const form =
                document.createElement("form");


              form.method =
                "post";


              form.action =
                "/Merchant/verify_payment";


              form.innerHTML =
                `<input type="hidden"
                        name="paymentId"
                        value="${response.razorpay_payment_id}">

                 <input type="hidden"
                        name="orderId"
                        value="${response.razorpay_order_id}">

                 <input type="hidden"
                        name="signature"
                        value="${response.razorpay_signature}">

                 <input type="hidden"
                        name="productId"
                        value="${productId}">

                 <input type="hidden"
                        name="buyQuantity"
                        value="${qty}">`;


              document.body.appendChild(form);

              form.submit();
            },


          prefill: {

            name:
              "[[${session.loggedInMerchant.name}]]",

            email:
              "[[${session.loggedInMerchant.email}]]"
          },


          theme: {

            color:
              "#198754"
          }

        };


        const razorpay =
          new Razorpay(options);


        razorpay.open();

      })

      .catch(e => {

        alert(
          "Unable to start payment: " +
          e
        );

      });

    }



    // =====================================================
    // DEMO ORDER
    // =====================================================

    function createDemoOrder() {

      const qty =
        parseInt(
          document.getElementById("buyQty").value
        );


      const productId =
        document.getElementById("productId").value;


      const input =
        document.getElementById("buyQty");


      const minQty =
        parseInt(input.min);


      const maxQty =
        parseInt(input.max);


      if (!Number.isInteger(qty) ||
          qty < minQty ||
          qty > maxQty) {

        alert(
          "Please enter a quantity between " +
          minQty +
          " and " +
          maxQty +
          "."
        );

        return;
      }


      if (!confirm(
        "Create demo order without Razorpay payment?"
      )) {

        return;
      }


      const form =
        document.createElement("form");


      form.method =
        "post";


      form.action =
        "/Merchant/demo-order";


      form.innerHTML =
        `<input type="hidden"
                name="productId"
                value="${productId}">

         <input type="hidden"
                name="buyQuantity"
                value="${qty}">

         <input type="hidden"
                name="source"
                value="FARMER">`;


      document.body.appendChild(form);

      form.submit();
    }

  </script>


  <!-- PDF + SweetAlert -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


  <!-- Receipt -->
  <script th:if="${msg}">

    async function generateReceiptPDF() {

      const { jsPDF } =
        window.jspdf;


      const doc =
        new jsPDF();


      const product =
        "[[${product.productName}]]" ||
        "Unknown Product";


      const quantity =
        parseFloat("[[${quantity}]]") ||
        0;


      const pricePerUnit =
        parseFloat("[[${product.pricePerUnit}]]") ||
        0;


      const transactionId =
        "[[${transactionId}]]" ||
        "N/A";


      const seller = {

        name:
          "[[${product.farmer.name}]]" ||
          "Unknown Seller",

        contact:
          "[[${product.farmer.contactno}]]" ||
          "N/A",

        location:
          "[[${product.farmer.address}]]" ||
          "N/A"
      };


      const buyer = {

        name:
          "[[${session.loggedInMerchant.name}]]" ||
          "Unknown Buyer",

        email:
          "[[${session.loggedInMerchant.email}]]" ||
          "N/A"
      };


      const totalAmount =
        quantity * pricePerUnit;


      const paymentDate =
        new Date().toLocaleString();


      // Header
      doc.setFillColor(
        34,
        139,
        34
      );


      doc.rect(
        0,
        0,
        210,
        30,
        "F"
      );


      doc.setTextColor(
        255,
        255,
        255
      );


      doc.setFontSize(20);


      doc.setFont(
        "helvetica",
        "bold"
      );


      doc.text(
        "AGRITRADE HUB",
        105,
        15,
        {
          align: "center"
        }
      );


      doc.setFontSize(12);


      doc.text(
        "Official Purchase Receipt",
        105,
        23,
        {
          align: "center"
        }
      );


      // Reset
      doc.setTextColor(
        0,
        0,
        0
      );


      doc.setFontSize(12);


      doc.setFont(
        "helvetica",
        "normal"
      );


      let y = 40;

      const lineHeight = 10;


      // Product details box
      doc.setDrawColor(
        34,
        139,
        34
      );


      doc.setLineWidth(
        0.8
      );


      doc.rect(
        15,
        y - 8,
        180,
        75
      );


      doc.setFont(
        "helvetica",
        "bold"
      );


      doc.text(
        "Product Details:",
        20,
        y
      );


      doc.setFont(
        "helvetica",
        "normal"
      );


      y += lineHeight;


      doc.text(
        `Name          : ${product}`,
        20,
        y
      );


      y += lineHeight;


      doc.text(
        `Quantity      : ${quantity}`,
        20,
        y
      );


      y += lineHeight;


      doc.text(
        `Price/Unit    : ${pricePerUnit.toFixed(2)} Rs.`,
        20,
        y
      );


      y += lineHeight;


      doc.text(
        `Total Amount  : ${totalAmount.toFixed(2)} Rs.`,
        20,
        y
      );


      y += lineHeight;


      doc.text(
        `Transaction ID: ${transactionId}`,
        20,
        y
      );


      y += lineHeight;


      doc.text(
        `Payment Date  : ${paymentDate}`,
        20,
        y
      );


      // Seller box
      y += 20;


      doc.rect(
        15,
        y - 8,
        85,
        50
      );


      doc.setFont(
        "helvetica",
        "bold"
      );


      doc.text(
        "Seller Details:",
        20,
        y
      );


      doc.setFont(
        "helvetica",
        "normal"
      );


      y += lineHeight;


      doc.text(
        `Name     : ${seller.name}`,
        20,
        y
      );


      y += lineHeight;


      doc.text(
        `Contact  : ${seller.contact}`,
        20,
        y
      );


      y += lineHeight;


      doc.text(
        `Location : ${seller.location}`,
        20,
        y
      );


      // Buyer box
      y -= 30;


      doc.rect(
        110,
        y - 8,
        85,
        50
      );


      doc.setFont(
        "helvetica",
        "bold"
      );


      doc.text(
        "Buyer Details:",
        115,
        y
      );


      doc.setFont(
        "helvetica",
        "normal"
      );


      y += lineHeight;


      doc.text(
        `Name  : ${buyer.name}`,
        115,
        y
      );


      y += lineHeight;


      doc.text(
        `Email : ${buyer.email}`,
        115,
        y
      );


      // Footer
      doc.setDrawColor(0);

      doc.setLineWidth(0.5);


      doc.line(
        15,
        240,
        195,
        240
      );


      doc.setFont(
        "helvetica",
        "italic"
      );


      doc.setFontSize(14);


      doc.setTextColor(
        34,
        139,
        34
      );


      doc.text(
        "Thank you for shopping with Agritrade Hub!",
        105,
        255,
        {
          align: "center"
        }
      );


      doc.save(
        `Receipt_${transactionId}.pdf`
      );

    }


    // Order success popup
    Swal.fire({

      title:
        "Order Placed!",

      text:
        "Order placed and payment initiated successfully.",

      icon:
        "success",

      showCancelButton:
        true,

      confirmButtonText:
        "Download Receipt",

      cancelButtonText:
        "OK",

      confirmButtonColor:
        "#3085d6",

      cancelButtonColor:
        "#aaa"

    })

    .then((result) => {

      if (result.isConfirmed) {

        generateReceiptPDF();

      }

    });

  </script>


  <!-- Quantity + Logistics -->
  <script>

    const qtyInput =
      document.getElementById("buyQty");


    const pricePerUnit =
      parseFloat(
        document.getElementById("unitPrice").innerText
      ) || 0;


    const totalDiv =
      document.getElementById("totalCost");


    const totalAmount =
      document.getElementById("totalAmount");


    const logisticsInfo =
      document.getElementById("logisticsInfo");


    const minQty =
      Number(qtyInput.min);


    const maxQty =
      Number(qtyInput.max);


    qtyInput.addEventListener(
      "input",
      function () {

        const qty =
          parseInt(this.value);


        if (
          Number.isInteger(qty) &&
          qty >= minQty &&
          qty <= maxQty
        ) {

          // Product amount
          totalAmount.innerText =
            (
              pricePerUnit * qty
            ).toFixed(2);


          totalDiv.classList.remove(
            "d-none"
          );


          // Logistics estimate
          fetch(
            `/Merchant/estimate-logistics?productId=${document.getElementById("productId").value}&quantity=${qty}&source=FARMER`
          )

          .then(r => r.json())

          .then(d => {

            logisticsInfo.classList.remove(
              "d-none"
            );


            if (d.success) {

              const vehicle =
                String(
                  d.vehicleType || ""
                ).replaceAll(
                  "_",
                  " "
                );


              logisticsInfo.innerHTML =
                `<strong>Road distance:</strong> ${d.roadDistanceKm} km |
                 <strong>Vehicle:</strong> ${vehicle}<br>
                 <strong>Logistics:</strong> ₹${Number(d.logisticsAmount || 0).toFixed(2)} |
                 <strong>Landed:</strong> ₹${Number(d.totalAmount || 0).toFixed(2)}`;

            } else {

              logisticsInfo.textContent =
                d.error ||
                "Unable to calculate logistics.";

            }

          })

          .catch(() => {

            logisticsInfo.textContent =
              "Unable to calculate logistics.";

          });


        } else {

          totalDiv.classList.add(
            "d-none"
          );


          logisticsInfo.classList.add(
            "d-none"
          );

        }

      }

    );

  </script>


  <!-- Error Message -->
  <input type="hidden"
         id="msg"
         th:if="${error}"
         th:value="${error}">


  <script>

    var msg =
      document.getElementById("msg");


    if (
      msg != null &&
      msg.value &&
      msg.value.trim() !== ""
    ) {

      alert(
        msg.value
      );

    }


    function validateQty(input) {

      const maxQty =
        parseInt(
          input.getAttribute("max")
        );


      const minQty =
        parseInt(
          input.getAttribute("min")
        );


      const currentVal =
        parseInt(
          input.value
        );


      if (
        isNaN(currentVal) ||
        currentVal < minQty ||
        currentVal > maxQty
      ) {

        input.setCustomValidity(
          "Please enter a quantity between " +
          minQty +
          " and " +
          maxQty +
          "."
        );

      } else {

        input.setCustomValidity("");

      }

    }

  </script>

</section>
</html>
