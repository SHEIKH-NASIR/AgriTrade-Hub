<html th:replace="~{Former/formerbase::layout(~{::section})}">
<head></head>

<body>
<section>
    <div class="row">

        <div class="container" style="margin-top: -20px;">
            <div class="card">
                <div class="card-header">
                    <div class="row">
                        <div class="col-md-8">
                            <div class="card-title">My Listed Products</div>
                        </div>

                        <div class="col-md-4">
                            <form th:action="@{/Former/ManageProduct}"
                                  method="get"
                                  class="d-flex">

                                <select name="status"
                                        class="form-control me-2">

                                    <option value=""
                                            th:selected="${selectedStatus == null}">
                                        All Status
                                    </option>

                                    <option value="Available"
                                            th:selected="${selectedStatus == 'Available'}">
                                        Available
                                    </option>

                                    <option value="OutOfStock"
                                            th:selected="${selectedStatus == 'OutOfStock'}">
                                        Out Of Stock
                                    </option>

                                </select>

                                <button type="submit"
                                        class="btn btn-primary ms-2">
                                    Search
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="card-body">
                    <div class="table-responsive">

                        <table class="table table-bordered align-middle"
                               id="example">

                            <thead class="table-success text-center">
                            <tr>
                                <th>Image</th>
                                <th>Product</th>
                                <th>Category</th>
                                <th>Quantity</th>
                                <th>Price/Unit</th>
                                <th>Selling Mode</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                            </thead>

                            <tbody>

                            <tr th:each="product : ${productList}">

                                <td class="text-center">
                                    <img th:if="${product.image != null and !#strings.isEmpty(product.image)}"
                                         th:src="@{'/ProductImage/' + ${product.image}}"
                                         alt="Image"
                                         class="img-thumbnail"
                                         style="width: 55px; height: 55px; object-fit: cover;">

                                    <span th:unless="${product.image != null and !#strings.isEmpty(product.image)}"
                                          class="text-muted">
                                        No Image
                                    </span>
                                </td>

                                <td th:text="${product.productName}">
                                    Product
                                </td>

                                <td th:text="${product.category}">
                                    Category
                                </td>

                                <td th:text="${product.quantity}">
                                    0
                                </td>

                                <td th:text="'₹' + ${product.pricePerUnit}">
                                    ₹0
                                </td>

                                <td>
                                    <span class="badge bg-primary"
                                          th:if="${product.sellingMode != null and product.sellingMode.equalsIgnoreCase('FPO')}">
                                        FPO Contribution
                                    </span>

                                    <span class="badge bg-secondary"
                                          th:unless="${product.sellingMode != null and product.sellingMode.equalsIgnoreCase('FPO')}">
                                        Independent Sale
                                    </span>
                                </td>

                                <td>
                                    <span class="badge bg-success"
                                          th:if="${product.status == 'Available'}">
                                        Available
                                    </span>

                                    <span class="badge bg-danger"
                                          th:unless="${product.status == 'Available'}"
                                          th:text="${product.status}">
                                        OutOfStock
                                    </span>
                                </td>

                                <td class="text-center">

                                    <!-- CORRECT EDIT ROUTE -->
                                    <a th:href="@{/Former/EditProduct/{id}(id=${product.id})}"
                                       class="btn btn-success btn-sm me-1">
                                        Edit
                                    </a>

                                    <!-- DELETE CONTROLLER IS POST, SO USE A FORM -->
                                    <form th:action="@{/Former/DeleteProduct/{id}(id=${product.id})}"
                                          method="post"
                                          style="display:inline;">

                                        <button type="submit"
                                                class="btn btn-danger btn-sm"
                                                onclick="return confirm('Are you sure to delete this product?')">
                                            Delete
                                        </button>

                                    </form>

                                </td>

                            </tr>

                            <tr th:if="${productList == null or #lists.isEmpty(productList)}">
                                <td colspan="8"
                                    class="text-center text-muted py-4">
                                    No products found. Please add a product.
                                </td>
                            </tr>

                            </tbody>

                        </table>

                    </div>
                </div>
            </div>
        </div>

    </div>
</section>
</body>
</html>
