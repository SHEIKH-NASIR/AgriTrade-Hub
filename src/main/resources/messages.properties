about.pagetitle=About AgriTrade Hub
about.breadcrumb=About us
about.whoweare=Who We Are
about.para1= AgriTrade Hub is a digital agricultural marketplace designedto directly connect farmers and Farmer Producer Organisations(FPOs) with consumers and bulk buyers. Our platform aims toreduce unnecessary intermediaries, improve farmer earnings,and provide consumers with transparent and competitive prices
about.para2=The platform combines digital marketplace services withlogistics support, allowing buyers to understand the completelanded cost of agricultural products instead of comparingproduct prices alone.
about.para3=AgriTrade Hub also uses technology-driven Fair Price validation,AI-based demand forecasting, and route/logistics optimizationto create a more transparent and efficient agriculturalsupply chain.
about.imagealt=Farmer and Merchant
about.mission=Our Mission
about.missiontext=To empower farmers by giving them direct access to genuine merchants and fair trade opportunities while ensuring merchants get quality products at the best prices.
about.whatweoffer=What We Offer
about.offer1=Secure Farmer and Merchant Registration
about.offer2=Live Product Listings
about.offer3=Dynamic Product Categories
about.offer4=Order Tracking System
about.offer5=Easy-to-use Dashboard for All Users

# Additional Services
services.item7.title=Secure Online Payments
services.item7.desc=Process agricultural transactions securely through integrated online payment services with reliable and convenient payment handling.

services.item8.title=AI-Based Demand Forecasting
services.item8.desc=Use AI-driven demand insights to help farmers and buyers understand expected product demand and make better procurement decisions.

services.item9.title=Logistics & Route Optimization
services.item9.desc=Optimize delivery routes and transportation planning to reduce travel time, improve delivery efficiency, and lower logistics costs.

services.item10.title=Fair Price Validation
services.item10.desc=Validate agricultural product prices against available market information to promote fair and transparent pricing for farmers and buyers.

services.item11.title=Landed Cost Calculation
services.item11.desc=Calculate the complete landed cost by combining product price and logistics expenses so buyers can compare the actual cost of procurement.

services.item12.title=Price & Logistics Comparison
services.item12.desc=Compare product prices together with transportation and logistics costs to identify more cost-effective procurement options.

