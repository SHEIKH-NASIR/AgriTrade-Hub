# About section
home.about.subtitle=Why Choose Us
home.about.title=Why AgriTrade Hub is the Smarter Choice
home.about.desc=AgriTrade Hub connects farmers directly with merchants, cutting out middlemen for better prices and faster trade. With a simple interface and secure transactions, we empower local farmers and support fair, sustainable agriculture.
home.about.feature1.title=Direct Marketplace
home.about.feature1.desc=We bridge the gap between farmers and merchants, ensuring fair and transparent trade without middlemen
home.about.feature2.title=Better Profits for Farmers
home.about.feature2.desc=By selling directly, farmers earn more from their hard work while merchants get fresh products at competitive rates.
home.about.feature3.title=User-Friendly Platform
home.about.feature3.desc=Simple, intuitive interface designed for all users \u2014 from small-scale farmers to large merchants.

# About-3 section
home.about3.title=Plants Make Life Better
home.about3.desc.bold=At AgriTrade Hub, we believe that plants are more than just greenery \u2014 they're a source of life, health, and sustainability.
home.about3.desc=From boosting air quality to enhancing mental well-being and supporting our food systems, plants play a vital role in making our lives better every day. Our platform connects farmers, nurseries, traders, and enthusiasts to promote the growth, trade, and appreciation of plants. Whether you're cultivating a garden or growing a business, AgriTrade Hub is where green meets growth.
home.about3.point1=Connects farmers directly with merchants to eliminate middlemen.
